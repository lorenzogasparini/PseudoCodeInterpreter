name: Java CI with Maven and JUnit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Utilizziamo 'working-directory' per spostarci dove risiede il pom.xml
      - name: Run Tests with Maven
        run: mvn clean test
        working-directory: PseudoCodeInterpreter