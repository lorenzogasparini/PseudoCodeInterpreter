name: Java CI with Maven and JUnit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Questo step ci mostrerà l'esatta struttura delle cartelle su GitHub
      - name: Controlla struttura file
        run: |
          echo "=== Cartella corrente ==="
          pwd
          echo "=== Contenuto della cartella ==="
          ls -R